name: دماغ مصري - Generate and upload private video

on:
  push:
    branches:
      - agent/improve-damagh-masry-video
    paths:
      - "damagh-masry/automation/**"
      - ".github/workflows/damagh-masry.yml"
  workflow_dispatch:
    inputs:
      topic:
        description: "موضوع الفيديو؛ اتركه فارغًا لاستخدام موضوع تلقائي"
        required: false
        type: string
      preview_only:
        description: "إنشاء نسخة تجريبية بدون رفعها إلى YouTube"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: read

jobs:
  create-private-video:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: damagh-masry
    env:
      TOPIC: ${{ inputs.topic || 'أداة ذكاء اصطناعي مجانية مفيدة للمصريين' }}
      TTS_VOICE: ar-EG-ShakirNeural
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
      GOOGLE_YOUTUBE_CLIENT_ID: ${{ secrets.GOOGLE_YOUTUBE_CLIENT_ID }}
      GOOGLE_YOUTUBE_CLIENT_SECRET: ${{ secrets.GOOGLE_YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install video and voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --disable-pip-version-check edge-tts==7.2.7

      - name: Generate Egyptian Arabic content
        run: node automation/generate_content.mjs

      - name: Render polished MP4
        run: node automation/render_video.mjs

      - name: Upload as private YouTube video
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.preview_only == false) }}
        run: node automation/upload_youtube.mjs

      - name: Save generated files for review
        uses: actions/upload-artifact@v4
        with:
          name: damagh-masry-video-${{ github.run_number }}
          path: damagh-masry/work/
          retention-days: 14
