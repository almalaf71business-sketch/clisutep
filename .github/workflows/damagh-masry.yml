name: دماغ مصري - Generate and upload private video

on:
  push:
    branches:
      - codex/improve-damagh-video-quality
    paths:
      - "damagh-masry/automation/**"
      - ".github/workflows/damagh-masry.yml"
  workflow_dispatch:
    inputs:
      topic:
        description: "موضوع الفيديو؛ اتركه فارغًا لاستخدام موضوع تلقائي"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: damagh-masry-video
  cancel-in-progress: true

jobs:
  create-private-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: damagh-masry
    env:
      TOPIC: ${{ inputs.topic || 'أداة ذكاء اصطناعي مجانية مفيدة للمصريين' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
      TTS_VOICE: ${{ secrets.TTS_VOICE || 'ar-EG-ShakirNeural' }}
      PYTHON_BINARY: .venv/bin/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install video and Arabic voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core python3-venv
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check edge-tts==7.2.3
          fc-cache -f

      - name: Generate Egyptian Arabic content
        run: node automation/generate_content.mjs

      - name: Download real licensed visual scenes
        run: node automation/fetch_scenes.mjs

      - name: Render animated MP4 with natural narration
        run: node automation/render_video.mjs

      - name: Validate rendered video
        run: |
          test -s work/video.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json work/video.mp4

      - name: Save generated files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damagh-masry-video-${{ github.run_number }}
          path: damagh-masry/work/
          if-no-files-found: warn
          retention-days: 14
